name: dogan

services:
  dogan-mediamtx:
    image: bluenviron/mediamtx:1.21.4
    container_name: dogan-mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - t3-net
    restart: "no"
    expose:
      - "8889"
      - "8888"
      - "1935"
      - "9997"
    ports:
      - "8889:8889"
      - "8888:8888"

  dogan-turn:
    image: coturn/coturn:4.19
    container_name: dogan-turn
    command:
      - --listening-port=5349
      - --no-tls
      - --no-dtls
      - --fingerprint
      - --realm=dogan-turn.xaigrok.ir
      - --no-cli
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${DOGAN_TURN_SECRET:-dogan-dev-turn-secret}
    networks:
      - t3-net
    restart: "no"
    expose:
      - "5349"

  dogan-cv:
    build:
      context: ../dogan-cv
      dockerfile: Dockerfile
    image: ${CV_IMAGE_TAG:-dogan-cv:latest}
    container_name: dogan-cv
    expose:
      - "8090"
    environment:
      DOGAN_CV_LISTEN: ":8090"
      DOGAN_FRAMES_DIR: /data/frames
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://pont.xaigrok.ir/api/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-opencodego-glm-5.3-flash}
      OPENCODE_GO_PROMPT: ${OPENCODE_GO_PROMPT:-Describe this camera image briefly. Note people, vehicles, hazards, or anything unusual.}
    volumes:
      - dogan-api-vol:/data
    networks:
      - t3-net
    restart: "no"

  dogan-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE_TAG:-dogan-api:latest}
    container_name: dogan-api
    depends_on:
      dogan-mediamtx:
        condition: service_started
      dogan-turn:
        condition: service_started
      dogan-cv:
        condition: service_started
    expose:
      - "8080"
    ports:
      - target: 8080
        published: ${DOGAN_PUBLISH_PORT-8080}
        protocol: tcp
    environment:
      DOGAN_LISTEN_ADDRESS: ":8080"
      DOGAN_EMBEDDED_API_TOKEN: ${DOGAN_EMBEDDED_API_TOKEN:-dg_dev_a8f3c2e1b9d74f6a0e5c3b9d2f7a1e4c8b6d0f3a7e2c9b5d1f8a4e6c0b3d7f9}
      DOGAN_DEVICE_API_KEY: ${DOGAN_DEVICE_API_KEY:-dogan-dev-key}
      DOGAN_JWT_SECRET: ${DOGAN_JWT_SECRET:-dogan-dev-jwt-secret}
      DOGAN_TOKEN_TTL: ${DOGAN_TOKEN_TTL:-86400}
      DOGAN_DATABASE_URL: file:/data/dogan.db
      DOGAN_FRAMES_DIR: /data/frames
      DOGAN_MEDIAMTX_WEBRTC_PUBLIC_URL: ${DOGAN_MEDIAMTX_WEBRTC_PUBLIC_URL:-http://localhost:8889}
      DOGAN_MEDIAMTX_HLS_PUBLIC_URL: ${DOGAN_MEDIAMTX_HLS_PUBLIC_URL:-http://localhost:8888}
      DOGAN_MEDIAMTX_API_URL: ${DOGAN_MEDIAMTX_API_URL:-http://dogan-mediamtx:9997}
      DOGAN_MEDIAMTX_RTMP_ADDRESS: ${DOGAN_MEDIAMTX_RTMP_ADDRESS:-dogan-mediamtx:1935}
      DOGAN_STREAM_TOKEN_SECRET: ${DOGAN_STREAM_TOKEN_SECRET:-}
      DOGAN_STREAM_TOKEN_TTL: ${DOGAN_STREAM_TOKEN_TTL:-3600}
      DOGAN_TURN_DOMAIN: ${DOGAN_TURN_DOMAIN:-}
      DOGAN_TURN_EXTERNAL_TLS: ${DOGAN_TURN_EXTERNAL_TLS:-true}
      DOGAN_TURN_SECRET: ${DOGAN_TURN_SECRET:-dogan-dev-turn-secret}
      DOGAN_TURN_TTL: ${DOGAN_TURN_TTL:-86400}
      DOGAN_ICE_SERVER_URLS: ${DOGAN_ICE_SERVER_URLS:-}
      DOGAN_CORS_ALLOWED_ORIGINS: ${DOGAN_CORS_ALLOWED_ORIGINS:-http://localhost:30808,http://127.0.0.1:30808,http://localhost:8083,https://dogan.xaigrok.ir}
      DOGAN_CV_URL: ${DOGAN_CV_URL:-http://dogan-cv:8090}
    volumes:
      - dogan-api-vol:/data
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  dogan-api-vol:
    name: dogan-api-vol
