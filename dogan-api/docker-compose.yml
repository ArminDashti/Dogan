name: dogan

services:
  dogan-livekit:
    image: livekit/livekit-server:latest
    container_name: dogan-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - dogan-livekit-vol:/data
    networks:
      - t3-net
    restart: "no"
    expose:
      - "7880"
      - "7881"
      - "7882"
    # Local/emulator: publish signaling + ICE UDP/TCP on the host.
    # Public T3 is 443/TCP only — use docker-compose.t3.yml (TURN on :5349,
    # no host UDP/7881). See Docs/modules/public-443-subdomains.md.
    # Keep UDP publish range small - large ranges hang docker-proxy on this host.
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50050:50000-50050/udp"

  dogan-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE_TAG:-dogan-api:latest}
    container_name: dogan-api
    depends_on:
      dogan-livekit:
        condition: service_started
    expose:
      - "8080"
    ports:
      - target: 8080
        published: ${DOGAN_PUBLISH_PORT-8080}
        protocol: tcp
    environment:
      DOGAN_LISTEN_ADDRESS: ":8080"
      DOGAN_EMBEDDED_API_TOKEN: ${DOGAN_EMBEDDED_API_TOKEN:-dg_dev_a8f3c2e1b9d74f6a0e5c3b9d2f7a1e4c8b6d0f3a7e2c9b5d1f8a4e6c0b3d7f9}
      DOGAN_DEVICE_API_KEY: ${DOGAN_DEVICE_API_KEY:-dogan-dev-key}
      DOGAN_JWT_SECRET: ${DOGAN_JWT_SECRET:-dogan-dev-jwt-secret}
      DOGAN_TOKEN_TTL: ${DOGAN_TOKEN_TTL:-86400}
      DOGAN_DATABASE_URL: file:/data/dogan.db
      DOGAN_FRAMES_DIR: /data/frames
      DOGAN_LIVEKIT_URL: ${DOGAN_LIVEKIT_URL:-ws://dogan-livekit:7880}
      # Local default; T3 overlay sets wss://dogan-livekit.xaigrok.ir
      DOGAN_LIVEKIT_PUBLIC_URL: ${DOGAN_LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      DOGAN_LIVEKIT_API_KEY: ${DOGAN_LIVEKIT_API_KEY:-devkey}
      DOGAN_LIVEKIT_API_SECRET: ${DOGAN_LIVEKIT_API_SECRET:-secret}
      DOGAN_LIVEKIT_TOKEN_TTL: ${DOGAN_LIVEKIT_TOKEN_TTL:-3600}
      DOGAN_CORS_ALLOWED_ORIGINS: ${DOGAN_CORS_ALLOWED_ORIGINS:-http://localhost:30808,http://127.0.0.1:30808,http://localhost:8083,https://dogan.xaigrok.ir}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://pont.xaigrok.ir/api/v1}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-opencodego-glm-5.3-flash}
      OPENCODE_GO_PROMPT: ${OPENCODE_GO_PROMPT:-Describe this camera image briefly. Note people, vehicles, hazards, or anything unusual.}
    volumes:
      - dogan-api-vol:/data
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  dogan-api-vol:
    name: dogan-api-vol
  dogan-livekit-vol:
    name: dogan-livekit-vol
