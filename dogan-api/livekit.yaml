port: 7880

rtc:
  tcp_port: 7881
  # Small range: mapping thousands of UDP ports hangs docker-proxy on this host.
  port_range_start: 50000
  port_range_end: 50050
  # Local Docker: leave STUN external IP off (VPN/public IP is unreachable
  # from the Android emulator). Public T3: use livekit.t3.yaml
  # (use_external_ip + TURN external_tls) — see Docs/modules/public-443-subdomains.md.
  use_external_ip: false

keys:
  devkey: secret
